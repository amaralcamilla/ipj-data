name: Atualiza transmissões recentes

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3)
    - cron: '0 15 * * 0' # domingo 12h, após EBD e culto matutino
    - cron: '0 1 * * 1' # domingo 22h, após culto noturno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Busca últimas transmissões
        run: node scripts/update-videos.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Publica alterações
        run: |
          if [ -z "$(git status --porcelain -- videos.json)" ]; then
            echo "Sem alterações em videos.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Atualiza transmissões recentes"
          git push
